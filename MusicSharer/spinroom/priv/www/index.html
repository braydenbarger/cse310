<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpinRoom</title>
<style>
  :root {
    --bg: #12111a; --panel: #1c1a27; --panel-2: #252233; --line: #34304a;
    --text: #eceaf5; --muted: #9a95b3; --accent: #ff6b4a; --accent-2: #ffb547;
    --good: #4ad9a4; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel-2);
           border-radius: 10px; padding: 8px 12px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { background: var(--accent-2); border-color: var(--accent-2); color: #1a1405; }
  input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: 16px; align-content: start; }

  #join { max-width: 420px; margin: 10vh auto 0; display: grid; gap: 12px; }
  #join p { margin: 0 0 6px; }

  .np-title { font-size: 24px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
  .np-artist { color: var(--muted); margin: 2px 0 6px; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 14px 0 4px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width 0.4s linear; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .player { margin-top: 14px; aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 10px; background: #000; }
  .section { margin-top: 18px; }
  .rating { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .rating button { padding: 8px 0; font-variant-numeric: tabular-nums; }
  .emojis { display: flex; flex-wrap: wrap; gap: 6px; }
  .emojis button { font-size: 18px; padding: 6px 10px; }
  .emojis .count { font-size: 13px; margin-left: 4px; }
  .skip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .score { font-size: 28px; font-weight: 800; color: var(--accent-2); }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.list li { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .small { font-size: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); }
  .pill.skipped { color: var(--accent); border-color: var(--accent); }
  .pill.finished { color: var(--good); border-color: var(--good); }
  .members { display: flex; flex-wrap: wrap; gap: 6px; }
  form.queue { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  form.queue .full { grid-column: 1 / -1; }
  a { color: var(--accent-2); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent);
           color: #fff; padding: 10px 16px; border-radius: 10px; display: none; max-width: calc(100% - 32px); }
  .empty { text-align: center; padding: 28px 0; }
  .vinyl { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px;
           background: radial-gradient(circle, var(--accent) 0 14%, #111 15% 100%);
           box-shadow: inset 0 0 0 6px #1b1b1b, inset 0 0 0 7px #2a2a2a, inset 0 0 0 14px #161616, inset 0 0 0 15px #2a2a2a; }
  .spinning { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">spin<span>room</span></div>
    <div class="spacer"></div>
    <div id="who" class="muted small"></div>
    <button id="leaveBtn" hidden>Leave room</button>
  </header>

  <form id="join" class="panel">
    <p class="muted">Join a room, queue songs, and listen together. Rate each track out of 10, react, and vote to skip.</p>
    <label>Your name <input id="nameIn" maxlength="64" required autocomplete="nickname"></label>
    <label>Room <input id="roomIn" maxlength="32" pattern="[A-Za-z0-9_\-]+" value="lobby" required></label>
    <button class="primary" type="submit">Join room</button>
    <div id="roomList" class="small muted"></div>
  </form>

  <div id="room" hidden>
    <div class="grid">
      <div class="stack">
        <section class="panel" id="nowPlaying"></section>
        <section class="panel">
          <h2>Queue a song</h2>
          <form class="queue" id="queueForm">
            <input class="full" id="qTitle" placeholder="Title" maxlength="200" required>
            <input id="qArtist" placeholder="Artist" maxlength="200">
            <input id="qDuration" placeholder="Length (m:ss)" value="3:30" pattern="\d{1,2}:\d{2}" required>
            <input class="full" id="qUrl" placeholder="Link (YouTube plays inline; optional)" maxlength="500">
            <button class="primary full" type="submit">Add to queue</button>
          </form>
        </section>
      </div>
      <div class="stack">
        <section class="panel">
          <h2>Up next</h2>
          <ul class="list" id="queueList"></ul>
        </section>
        <section class="panel">
          <h2>In the room</h2>
          <div class="members" id="memberList"></div>
        </section>
        <section class="panel">
          <h2>Listening log</h2>
          <ul class="list" id="historyList"></ul>
        </section>
      </div>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
const EMOJIS = ["🔥", "😍", "💃", "🎉", "🤯", "😂", "😴", "👎"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

let me = null, room = null, state = null, clockOffset = 0, playerTrackId = null, pollTimer = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
const act = (action, extra = {}) =>
  api("POST", `/api/rooms/${encodeURIComponent(room)}/${action}`, { user: me, ...extra })
    .then(setState).catch((e) => toast(e.message));

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 3000);
}

function setState(s) {
  state = s;
  clockOffset = s.server_time - Date.now();
  render();
}

async function poll() {
  try { setState(await api("GET", `/api/rooms/${encodeURIComponent(room)}?user=${encodeURIComponent(me)}`)); }
  catch (e) { toast(e.message); }
}

async function loadHistory() {
  try {
    const { history } = await api("GET", `/api/history?room=${encodeURIComponent(room)}&limit=25`);
    $("historyList").innerHTML = history.length ? history.map((h) => {
      const rx = Object.entries(h.reactions || {}).map(([e, n]) => `${esc(e)}${n}`).join(" ");
      return `<li>
        <div class="row"><strong>${esc(h.title)}</strong><span class="pill ${esc(h.outcome)}">${esc(h.outcome)}</span></div>
        <div class="muted small">${esc(h.artist || "Unknown artist")} · added by ${esc(h.added_by)}</div>
        <div class="row small"><span>${h.avg_rating == null ? "No ratings" : `★ ${h.avg_rating}/10 (${Object.keys(h.ratings).length})`}</span>
          <span>${rx}</span></div>
      </li>`;
    }).join("") : `<li class="muted small">Nothing played yet.</li>`;
  } catch (e) { /* history is non-critical */ }
}

function youtubeId(url) {
  try {
    const u = new URL(url);
    if (u.hostname === "youtu.be") return u.pathname.slice(1);
    if (u.hostname.endsWith("youtube.com")) {
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      const m = u.pathname.match(/^\/(shorts|embed)\/([\w-]+)/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
}

function renderNowPlaying() {
  const np = state.now_playing, el = $("nowPlaying");
  if (!np) {
    playerTrackId = null;
    el.innerHTML = `<h2>Now playing</h2><div class="empty"><div class="vinyl"></div>
      <div class="muted">Silence… queue something to get the room spinning.</div></div>`;
    return;
  }
  const elapsed = (Date.now() + clockOffset - np.started_at) / 1000;
  if (playerTrackId !== np.id) {
    playerTrackId = np.id;
    const yt = np.url && youtubeId(np.url);
    const link = np.url ? `<a href="${esc(np.url)}" target="_blank" rel="noopener noreferrer">Open link ↗</a>` : "";
    el.innerHTML = `
      <h2>Now playing</h2>
      <div class="row"><div><p class="np-title">${esc(np.title)}</p>
        <p class="np-artist">${esc(np.artist || "Unknown artist")} · added by ${esc(np.added_by)}</p>${link}</div>
        <div style="text-align:right"><div class="score" id="avg"></div><div class="muted small" id="avgCount"></div></div></div>
      <div class="bar"><div id="progress"></div></div>
      <div class="times"><span id="elapsed"></span><span>${fmt(np.duration)}</span></div>
      ${yt ? `<iframe class="player" allow="autoplay; encrypted-media" allowfullscreen
        src="https://www.youtube.com/embed/${encodeURIComponent(yt)}?autoplay=1&start=${Math.floor(elapsed)}"></iframe>` : ""}
      <div class="section"><h2>Your rating</h2><div class="rating" id="rating"></div></div>
      <div class="section"><h2>React</h2><div class="emojis" id="emojis"></div></div>
      <div class="section skip"><button id="skipBtn"></button><span class="muted small" id="skipInfo"></span></div>`;
    $("skipBtn").onclick = () => act("skip");
  }
  $("avg").textContent = np.avg_rating == null ? "–" : `${np.avg_rating}/10`;
  $("avgCount").textContent = `${np.rating_count} rating${np.rating_count === 1 ? "" : "s"}`;
  $("rating").innerHTML = Array.from({ length: 10 }, (_, i) => i + 1)
    .map((n) => `<button data-score="${n}" class="${np.your_rating === n ? "on" : ""}">${n}</button>`).join("");
  const counts = Object.fromEntries(np.reactions.map((r) => [r.emoji, r]));
  $("emojis").innerHTML = EMOJIS.map((e) => {
    const r = counts[e];
    return `<button data-emoji="${e}" class="${r && r.mine ? "on" : ""}">${e}${r ? `<span class="count">${r.count}</span>` : ""}</button>`;
  }).join("");
  const skip = $("skipBtn");
  skip.textContent = np.you_voted_skip ? "Voted to skip" : "Vote to skip";
  skip.className = np.you_voted_skip ? "on" : "";
  skip.disabled = np.you_voted_skip;
  $("skipInfo").textContent = `${np.skip_votes} / ${np.skips_needed} votes needed (more than half of ${state.members.length} listening)`;
  tick();
}

function tick() {
  const np = state && state.now_playing;
  if (!np || !$("progress")) return;
  const elapsed = Math.min(np.duration, (Date.now() + clockOffset - np.started_at) / 1000);
  $("progress").style.width = `${(elapsed / np.duration) * 100}%`;
  $("elapsed").textContent = fmt(elapsed);
}

let lastPlayingId;
function render() {
  $("who").textContent = `${me} in #${state.room}`;
  renderNowPlaying();
  $("queueList").innerHTML = state.queue.length ? state.queue.map((t, i) => `<li>
      <div class="row"><strong>${i + 1}. ${esc(t.title)}</strong><span class="muted small">${fmt(t.duration)}</span></div>
      <div class="muted small">${esc(t.artist || "Unknown artist")} · added by ${esc(t.added_by)}</div></li>`).join("")
    : `<li class="muted small">The queue is empty.</li>`;
  $("memberList").innerHTML = state.members.map((m) => `<span class="pill">${m === me ? "🎧 " : ""}${esc(m)}</span>`).join("");
  const playingId = state.now_playing ? state.now_playing.id : null;
  if (playingId !== lastPlayingId) { lastPlayingId = playingId; loadHistory(); }
}

$("nowPlaying").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.score) act("rate", { score: Number(b.dataset.score) });
  if (b.dataset.emoji) act("react", { emoji: b.dataset.emoji });
});

$("queueForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const [m, s] = $("qDuration").value.split(":").map(Number);
  await act("queue", { title: $("qTitle").value, artist: $("qArtist").value, url: $("qUrl").value.trim(), duration: m * 60 + s });
  $("qTitle").value = $("qArtist").value = $("qUrl").value = "";
});

$("join").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  me = $("nameIn").value.trim();
  room = $("roomIn").value.trim().toLowerCase();
  try {
    setState(await api("POST", `/api/rooms/${encodeURIComponent(room)}/join`, { user: me }));
  } catch (e) { return toast(e.message); }
  try { localStorage.setItem("spinroom", JSON.stringify({ me, room })); } catch (e) {}
  $("join").hidden = true; $("room").hidden = false; $("leaveBtn").hidden = false;
  history.replaceState(null, "", `#${room}`);
  pollTimer = setInterval(poll, 1500);
  setInterval(tick, 500);
});

$("leaveBtn").onclick = async () => {
  clearInterval(pollTimer);
  await api("POST", `/api/rooms/${encodeURIComponent(room)}/leave`, { user: me }).catch(() => {});
  location.hash = ""; location.reload();
};
window.addEventListener("pagehide", () => {
  if (me && room) navigator.sendBeacon(`/api/rooms/${encodeURIComponent(room)}/leave`, JSON.stringify({ user: me }));
});

(async function init() {
  try {
    const saved = JSON.parse(localStorage.getItem("spinroom") || "null");
    if (saved) { $("nameIn").value = saved.me; $("roomIn").value = saved.room; }
  } catch (e) {}
  if (location.hash.length > 1) $("roomIn").value = decodeURIComponent(location.hash.slice(1));
  try {
    const { rooms } = await api("GET", "/api/rooms");
    if (rooms.length) $("roomList").innerHTML = "Open rooms: " + rooms.map((r) =>
      `<a href="#" data-room="${esc(r)}">#${esc(r)}</a>`).join(", ");
  } catch (e) {}
})();
$("roomList").addEventListener("click", (ev) => {
  const a = ev.target.closest("a[data-room]");
  if (a) { ev.preventDefault(); $("roomIn").value = a.dataset.room; }
});
</script>
</body>
</html>
